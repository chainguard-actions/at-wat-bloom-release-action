name: Test tag_and_release input - action runs with tag_and_release enabled
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ros_distro: noetic
          github_token_bloom: fake-token-for-testing
          github_user: test-user
          git_email: test@example.com
          tag_and_release: "true"

      - name: Assert action ran with tag_and_release input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # With fake credentials, git ls-remote will fail (auth error) or
          # git push will fail. Either way the action fails, which is expected.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # since the Docker container ran and the entrypoint executed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with tag_and_release input (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
