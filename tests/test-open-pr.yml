name: Test open PR scenario with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with open_pr and optional inputs
        id: action
        uses: .
        with:
          ros_distro: humble
          github_token_bloom: fake-token-for-testing
          github_user: test-user
          git_user: Test User
          git_email: test@example.com
          repository: my-ros-package
          open_pr: "true"
          debug_bloom: "true"
        continue-on-error: true
      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to auth/network issues,
          # not due to missing required inputs or Docker build errors.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with optional inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
