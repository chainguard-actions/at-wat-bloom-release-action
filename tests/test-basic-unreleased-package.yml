name: Test basic usage with unreleased package
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create package.xml fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.xml" <<'EOF'
          <?xml version="1.0"?>
          <package format="2">
            <name>my_unreleased_test_package_xyz</name>
            <version>0.1.0</version>
            <description>An unreleased test ROS package</description>
            <maintainer email="test@example.com">Test User</maintainer>
            <license>Apache-2.0</license>
          </package>
          EOF

      - name: Set up git config and reachable origin inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add package.xml
          git commit -m "Add package.xml for test" || true
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          ros_distro: "noetic"
          github_token_bloom: "fake-token-not-used"
          github_user: "testuser"
          git_user: "Test User"
          git_email: "test@example.com"
          open_pr: "false"
          debug_bloom: "false"

      - name: Assert action completed without error
        run: |
          echo "PASS: action completed successfully for unreleased package (skipped bloom-release as expected)"
