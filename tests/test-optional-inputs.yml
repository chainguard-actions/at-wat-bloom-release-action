name: Test invocation with optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with optional inputs
        id: action
        uses: .
        with:
          ros_distro: noetic
          github_token_bloom: fake-token-for-testing
          github_user: test-user
          git_user: Test User
          git_email: test@example.com
          repository: my-ros-package
          tag_and_release: "false"
          open_pr: "false"
          debug_bloom: "false"
        continue-on-error: true
      - name: Assert action was invoked (step ran, even if it failed due to invalid credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with optional inputs (outcome=$OUTCOME)"
