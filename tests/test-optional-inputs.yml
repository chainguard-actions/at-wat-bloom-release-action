name: Test optional inputs - repository override and debug_bloom
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ros_distro: humble
          github_token_bloom: fake-token-for-testing
          github_user: ci-user
          git_user: CI Bot
          git_email: ci@example.com
          repository: my_ros_package
          debug_bloom: "true"

      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (Docker container starts, entrypoint executes).
          # It will fail at rosdep/bloom-release due to fake credentials,
          # but it should not fail at startup or input parsing.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with optional inputs (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
