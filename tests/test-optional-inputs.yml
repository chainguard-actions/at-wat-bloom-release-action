name: Test optional inputs (debug_bloom, open_pr, release_repository_push_url)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REPOSITORY: test-org/test-package
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create package.xml fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.xml" <<'EOF'
          <?xml version="1.0"?>
          <package format="2">
            <name>test_package</name>
            <version>3.1.0</version>
            <description>Test ROS package for optional inputs</description>
            <maintainer email="test@example.com">Test User</maintainer>
            <license>Apache-2.0</license>
          </package>
          EOF
      - id: action
        uses: .
        continue-on-error: true
        with:
          ros_distro: "humble noetic"
          github_token_bloom: "fake-token-for-testing"
          github_user: "test-user"
          git_user: "Test User"
          git_email: "test@example.com"
          repository: "test-package"
          release_repository_push_url: "https://github.com/test-user/test-package-release"
          open_pr: "false"
          debug_bloom: "true"
      - name: Assert action ran with optional inputs
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail at network operations without real credentials.
          # We verify the action ran (not skipped).
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with optional inputs (outcome: $OUTCOME)"
