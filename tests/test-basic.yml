name: Test basic inputs - action starts and runs setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ros_distro: noetic
          github_token_bloom: fake-token-for-testing
          github_user: test-user
          git_email: test@example.com

      - name: Assert action ran (setup completed or failed at bloom stage)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action is expected to fail because fake credentials are used,
          # but it should fail at bloom-release or rosdep, not at startup.
          # We accept both 'success' and 'failure' as valid outcomes here,
          # since the Docker container ran and the entrypoint executed.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
