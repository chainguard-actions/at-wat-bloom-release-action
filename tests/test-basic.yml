name: Test basic required inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with required inputs (expect failure due to invalid token)
        id: action
        uses: .
        with:
          ros_distro: humble
          github_token_bloom: fake-token-for-testing
          github_user: test-user
          git_email: test@example.com
        continue-on-error: true
      - name: Assert action ran (not a setup/configuration error)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should either succeed or fail due to auth/network issues,
          # not due to missing required inputs or Docker build errors.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
