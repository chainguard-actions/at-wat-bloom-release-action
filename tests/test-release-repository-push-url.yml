name: Test release_repository_push_url input override
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          ros_distro: humble
          github_token_bloom: fake-token-for-testing
          github_user: ci-user
          git_email: ci@example.com
          release_repository_push_url: https://github.com/ci-user/my_ros_package-release.git

      - name: Assert action ran with release_repository_push_url
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          # The action should run (Docker container starts, entrypoint executes).
          # It will fail at rosdep/bloom-release due to fake credentials,
          # but it should not fail at startup or input parsing.
          if [ "$OUTCOME" = "success" ] || [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action ran with release_repository_push_url (outcome=$OUTCOME)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
