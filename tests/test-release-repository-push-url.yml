name: Test release_repository_push_url input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Test action with release_repository_push_url override
        id: action
        uses: .
        with:
          ros_distro: humble
          github_token_bloom: fake-token-for-testing
          github_user: test-user
          git_email: test@example.com
          release_repository_push_url: https://github.com/test-user/test-release-repo.git
        continue-on-error: true
      - name: Assert action was invoked with release_repository_push_url
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action was invoked with release_repository_push_url (outcome=$OUTCOME)"
