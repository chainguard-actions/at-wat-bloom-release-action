name: Test tag_and_release exits cleanly when tag already exists
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create package.xml fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.xml" <<'EOF'
          <?xml version="1.0"?>
          <package format="2">
            <name>test_pkg</name>
            <version>2.0.0</version>
            <description>Test package</description>
            <maintainer email="test@example.com">Test</maintainer>
            <license>Apache-2.0</license>
          </package>
          EOF

      - name: Set up git config, pre-existing tag, and bare remote inside workspace
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          # Commit the package.xml
          git add package.xml
          git commit -m "Add package.xml for test" || true
          # Create the tag locally so it already exists
          git tag 2.0.0 || true
          # Create a bare repo under GITHUB_WORKSPACE so it's visible inside the container
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          # Push the pre-existing tag to the remote
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          # Point origin at the in-workspace bare repo
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          ros_distro: "noetic"
          github_token_bloom: "fake-bloom-token"
          github_user: "testuser"
          git_email: "test@example.com"
          repository: "test_pkg"
          tag_and_release: "true"
          open_pr: "false"
          debug_bloom: "false"

      - name: Assert version output is empty (tag already existed, action exited early)
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty version output when tag already exists, got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version output is empty as expected (tag already existed)"
