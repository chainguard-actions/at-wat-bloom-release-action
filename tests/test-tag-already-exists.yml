name: Test tag_and_release when tag already exists
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Create package.xml fixture
        run: |
          cat > "$GITHUB_WORKSPACE/package.xml" <<'EOF'
          <?xml version="1.0"?>
          <package format="2">
            <name>existing_tag_package</name>
            <version>3.0.0</version>
            <description>A test ROS package whose tag already exists</description>
            <maintainer email="test@example.com">Test User</maintainer>
            <license>Apache-2.0</license>
          </package>
          EOF

      - name: Set up git config and reachable origin with pre-existing tag
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          git add package.xml
          git commit -m "Add package.xml for test" || true
          # Create the tag locally so it gets pushed to the bare remote
          git tag 3.0.0 || true
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git push "$GITHUB_WORKSPACE/.git-remote" --tags
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        with:
          ros_distro: "noetic"
          github_token_bloom: "fake-token-for-tag-only"
          github_user: "testuser"
          git_user: "Test User"
          git_email: "test@example.com"
          tag_and_release: "true"
          open_pr: "false"

      - name: Assert version output is empty when tag already exists
        env:
          ACTUAL: ${{ steps.action.outputs.version }}
        run: |
          echo "actual version: '$ACTUAL'"
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty version output when tag already exists, but got '$ACTUAL'"
            exit 1
          fi
          echo "PASS: version output is empty as expected (tag already existed)"
